# Migrated from ~/.config/opencode/tui.json.
# OMP supports single chords, not OpenCode's <leader> sequences.
app.model.cycleForward: F2
app.model.cycleBackward: Shift+F2
app.clipboard.pasteImage:
  - Ctrl+Shift+V
  - Ctrl+V
  - Alt+V

# Autocomplete menu navigation.
# Tab also toggles plan mode during normal input via tab-plan-toggle extension.
tui.input.tab: []
tui.select.down:
  - Down
  - Tab
tui.select.up:
  - Up
  - Shift+Tab
tui.select.confirm: Enter

# Enter must stay on tui.input.submit so the autocomplete popup can confirm
# with it (the popup confirms on tui.input.submit, NOT tui.select.confirm;
# terminals send CR, so the editor's literal "\n" fallback never fires).
# In normal input the app-level followUp binding below still wins, so Enter
# keeps queueing a follow-up instead of submitting.
tui.input.submit:
  - Enter
  - Ctrl+Enter

# Enter queues a follow-up (does not interrupt the current turn).
# Idle Enter still sends via followUp. Ctrl+Enter steers / interrupts.
# Shift+Enter / Ctrl+J stay as newline.
app.message.followUp: Enter

# Thinking level cycle (was Shift+Tab; Ctrl+T was visibility toggle).
app.thinking.cycle: Ctrl+T
app.thinking.toggle: []
# Normal input: Tab toggles write <-> plan mode.
app.plan.toggle:
  - Tab
  - Alt+Shift+P

# Chat/transcript paging is handled by WezTerm (Ctrl+U / Ctrl+E -> ScrollByPage).
# OMP page* only moves the multi-line draft cursor and is a no-op on short input.
# Keep physical PageUp/PageDown for editor/select lists only.
tui.editor.pageUp: PageUp
tui.editor.pageDown: PageDown
tui.select.pageUp: PageUp
tui.select.pageDown: PageDown
# Free Emacs kill-line; line end stays End (Ctrl+E is WezTerm scroll down).
tui.editor.deleteToLineStart: []
tui.editor.cursorLineEnd: End
